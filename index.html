<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#60A5FA" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aditya Jadhav | Software Engineer</title>
    <!--
      Metadata block (through the JSON-LD script below): duplicates content that
      lives in src/content/site.ts, because static HTML cannot import TypeScript
      and this markup must be present before any script runs. Specifically:
        - site.roles      -> the description/og:description/twitter:description
                              copy ("Software Engineering Intern @ Lumulus
                              Technologies, IT Security Programmer @ UC San
                              Diego") and the JSON-LD "jobTitle" array.
        - site.social      -> the JSON-LD "sameAs" array (GitHub, LinkedIn).
        - site.education.institution -> the JSON-LD "affiliation.name"
                              ("UC San Diego").
      The <title> itself ("Software Engineer") is a deliberate editorial
      condensation, not a verbatim copy of site.roles. Leave it as-is even
      though it doesn't match those strings exactly.
      When site.ts changes (e.g. the Lumulus internship ends), update every
      tag above by hand. Keep the three description copies identical to each
      other and at or under 160 characters. Keep the two theme-color values
      in sync with --color-background in src/styles/theme.css, and the
      favicon/mask-icon color in sync with --color-accent (dark theme, since
      the favicon is built on the dark palette).
    -->
    <meta
      name="description"
      content="Aditya Jadhav. Software Engineering Intern @ Lumulus Technologies, IT Security Programmer @ UC San Diego. Portfolio of projects, experience, certifications."
    />
    <link rel="canonical" href="https://adityajadhav17.github.io/" />

    <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aditya Jadhav" />
    <meta property="og:title" content="Aditya Jadhav | Software Engineer" />
    <meta
      property="og:description"
      content="Aditya Jadhav. Software Engineering Intern @ Lumulus Technologies, IT Security Programmer @ UC San Diego. Portfolio of projects, experience, certifications."
    />
    <meta property="og:url" content="https://adityajadhav17.github.io/" />
    <meta property="og:image" content="https://adityajadhav17.github.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aditya Jadhav | Software Engineer" />
    <meta
      name="twitter:description"
      content="Aditya Jadhav. Software Engineering Intern @ Lumulus Technologies, IT Security Programmer @ UC San Diego. Portfolio of projects, experience, certifications."
    />
    <meta name="twitter:image" content="https://adityajadhav17.github.io/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Aditya Jadhav",
        "url": "https://adityajadhav17.github.io/",
        "jobTitle": ["Software Engineering Intern", "IT Security Programmer"],
        "sameAs": [
          "https://github.com/AdityaJadhav17",
          "https://www.linkedin.com/in/aditya-jadhav-06484123a/"
        ],
        "affiliation": {
          "@type": "CollegeOrUniversity",
          "name": "UC San Diego"
        }
      }
    </script>
    <!--
      Flash-prevention: applies the .dark class before first paint, so the
      page never flashes the wrong theme. This intentionally duplicates the
      resolution rules in src/lib/theme.ts (getStoredTheme + resolveTheme):
      that module can't load early enough to run before paint, so the logic
      is inlined here instead of shared. Keep the two in sync by hand; do
      not "clean up" this duplication.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark' && t !== 'system') t = 'system';
          var dark = t === 'dark' || (t === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Space+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
