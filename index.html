<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#60A5FA" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)" />
    <!--
      Filled at build time by scripts/prerender.mjs from src/lib/head.ts.
      Do not hand-write meta tags here. Keep the two theme-color values above
      in sync with --color-background in src/styles/theme.css, and the
      favicon/mask-icon color in sync with --color-accent (dark theme).
      public/CNAME keeps the custom domain bound; the canonical and og URLs
      in head.ts point at adityajadhav.dev, not the github.io origin.
    -->
    <!--app-head-->
    <!--
      Flash-prevention: applies the .dark class before first paint, so the
      page never flashes the wrong theme. This intentionally duplicates the
      resolution rules in src/lib/theme.ts (getStoredTheme + resolveTheme):
      that module can't load early enough to run before paint, so the logic
      is inlined here instead of shared. Keep the two in sync by hand; do
      not "clean up" this duplication.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark' && t !== 'system') t = 'system';
          var dark = t === 'dark' || (t === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
