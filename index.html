    <!--
      Metadata block (through the JSON-LD script below): duplicates content that
      lives in src/content/site.ts, because static HTML cannot import TypeScript
      and this markup must be present before any script runs. Specifically:
        - site.roles      -> the description/og:description/twitter:description

                              Diego") and the JSON-LD "jobTitle" array.

        - site.education.institution -> the JSON-LD "affiliation.name"
                              ("UC San Diego").
      The <title> itself ("Software Engineer") is a deliberate editorial
      condensation, not a verbatim copy of site.roles. Leave it as-is even
      though it doesn't match those strings exactly.
      When site.ts changes (e.g. the Lumulus internship ends), update every
      tag above by hand. Keep the three description copies identical to each
      other and at or under 160 characters. Keep the two theme-color values
      in sync with --color-background in src/styles/theme.css, and the
      favicon/mask-icon color in sync with --color-accent (dark theme, since
      the favicon is built on the dark palette).
    -->

    <!--
      Flash-prevention: applies the .dark class before first paint, so the
      page never flashes the wrong theme. This intentionally duplicates the
      resolution rules in src/lib/theme.ts (getStoredTheme + resolveTheme):
      that module can't load early enough to run before paint, so the logic
      is inlined here instead of shared. Keep the two in sync by hand; do
      not "clean up" this duplication.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark' && t !== 'system') t = 'system';
          var dark = t === 'dark' || (t === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
