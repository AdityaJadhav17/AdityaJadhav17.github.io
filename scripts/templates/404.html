<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Aditya Jadhav</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --color-background: {{light.background}};
        --color-foreground: {{light.foreground}};
        --color-muted-foreground: {{light.muted-foreground}};
        --color-primary: {{light.primary}};
        --color-primary-foreground: {{light.primary-foreground}};
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --color-background: {{dark.background}};
          --color-foreground: {{dark.foreground}};
          --color-muted-foreground: {{dark.muted-foreground}};
          --color-primary: {{dark.primary}};
          --color-primary-foreground: {{dark.primary-foreground}};
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--color-background);
        color: var(--color-foreground);
        font-family: ui-sans-serif, system-ui, sans-serif;
        line-height: 1.6;
        padding: 1.5rem;
        text-align: center;
      }
      main {
        max-width: 28rem;
      }
      .code {
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-weight: 700;
        font-size: clamp(3rem, 12vw, 5rem);
        margin: 0 0 0.5rem;
        letter-spacing: -0.02em;
      }
      h1 {
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-weight: 600;
        font-size: 1.25rem;
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--color-muted-foreground);
        margin: 0 0 1.75rem;
      }
      a.home-link {
        display: inline-block;
        background: var(--color-primary);
        color: var(--color-primary-foreground);
        text-decoration: none;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        transition: opacity 200ms ease;
      }
      a.home-link:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>This page doesn&rsquo;t exist</h1>
      <p>The page you&rsquo;re looking for was moved or never existed.</p>
      <a class="home-link" href="/">Back to home</a>
    </main>
  </body>
</html>
