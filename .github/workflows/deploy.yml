name: Deploy Vite React App to GitHub Pages

on:
  push:
    branches: [ main ]

# No token access by default; each job requests only what it needs.
permissions: {}

# Serialise deploys so two pushes never publish at the same time, and let a
# running deploy finish rather than cancelling it halfway through a publish.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  # Runs all the project's code (npm scripts, build tooling) with a read-only
  # token that is not persisted into the checkout.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # Installs devDependencies too (no --omit=dev): vite, tsc, eslint and
      # vitest are devDependencies and the build and verify steps need them.
      # `npm ci` (not `npm install`) so the build always uses exactly what's
      # locked in package-lock.json.
      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run typecheck && npm run lint && npm test

      - name: Build
        run: npm run build

      - name: Upload site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 1

  # Has write access but runs no project code: it only downloads the built
  # files and hands them to the publish action. No checkout, no npm.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: ./dist

      - name: Deploy
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
