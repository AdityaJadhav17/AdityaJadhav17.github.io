name: Deploy Vite React App to Cloudflare Pages

on:
  push:
    branches: [ main ]

# No token access by default; each job requests only what it needs.
permissions: {}

# Serialise deploys so two pushes never publish at the same time, and let a
# running deploy finish rather than cancelling it halfway through a publish.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  # Runs all the project's code (npm scripts, build tooling) with a read-only
  # token that is not persisted into the checkout.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Installs devDependencies too (no --omit=dev): vite, tsc, eslint and
      # vitest are devDependencies and the build and verify steps need them.
      # `npm ci` (not `npm install`) so the build always uses exactly what's
      # locked in package-lock.json.
      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run typecheck && npm run lint && npm test

      - name: Build
        run: npm run build

      - name: Upload site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: dist
          # v4 skips hidden files by default, which would drop dist/.well-known/.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Runs no project code: it only downloads the built files and uploads them
  # to Cloudflare Pages, which serves adityajadhav.dev. The Cloudflare token
  # can only edit Pages, and only the two wrangler steps can see it.
  publish-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # --no-install: only the wrangler locked in package-lock.json may run.
      WRANGLER: npx --no-install wrangler
    steps:
      # Only the two files npm ci needs, so no project code lands in this job.
      - name: Checkout lockfile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false

      - name: Download site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: ./dist

      # Wrangler 4 needs Node 22.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Wrangler comes from the lockfile, hash-checked, with install scripts
      # off and no secrets in the environment.
      - name: Install wrangler
        run: npm ci --ignore-scripts

      # Creates the Pages project on the first run only.
      - name: Ensure Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: $WRANGLER pages project list | grep -qw adityajadhav-dev || $WRANGLER pages project create adityajadhav-dev --production-branch=main

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: $WRANGLER pages deploy dist --project-name=adityajadhav-dev --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true
