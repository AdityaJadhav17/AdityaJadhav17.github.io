name: Deploy Vite React App to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Installs devDependencies too (no --omit=dev): `shadcn` lives in
      # devDependencies but src/styles/theme.css imports
      # "shadcn/tailwind.css" at build time, so `vite build` needs it in
      # node_modules. `npm ci` (not `npm install`) so the build always uses
      # exactly what's locked in package-lock.json.
      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run typecheck && npm run lint && npm test

      - name: Build
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
